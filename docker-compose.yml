version: '3.8'

services:
  essl-gateway:
    build: .
    container_name: essl-gateway
    restart: unless-stopped
    env_file: .env
    network_mode: host               # Keep this (needed for local biometric devices)
    volumes:
      - ./data:/app/data             # ← Add this
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"